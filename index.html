<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050913">
<meta name="description" content="TAPSTRONAUT — one tap, endless space. Watch real gameplay, then download free on the App Store or Google Play.">
<meta property="og:title" content="TAPSTRONAUT — One tap. Endless space.">
<meta property="og:description" content="Dodge asteroids. Chase your high score. Play free on iOS and Android.">
<meta property="og:type" content="website">
<title>TAPSTRONAUT — One tap. Endless space.</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:dark;--cyan:#00f4ff}
html,body{margin:0;min-height:100%;background:#030712}
body{min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 42%,#0d1940 0,#030712 68%);color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{width:min(100vw,768px);margin:auto}
.mockup{position:relative;width:100%;aspect-ratio:2/3;isolation:isolate;overflow:hidden;background:#020715}
.art{display:block;position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.video-frame{position:absolute;z-index:2;left:20.6%;top:40.6%;width:58.8%;height:26.1%;overflow:hidden;border-radius:5%;background:#05070c}
video{display:block;width:100%;height:100%;object-fit:cover;object-position:center 55%;background:#05070c}
.play{position:absolute;z-index:3;left:50%;top:50%;transform:translate(-50%,-50%);width:13.5%;aspect-ratio:1;border:3px solid #fff;border-radius:50%;background:#0008;display:grid;place-items:center;padding:0;cursor:pointer;box-shadow:0 2px 14px #0009}
.play::before{content:"";width:0;height:0;margin-left:7%;border-top:clamp(10px,2.3vw,20px) solid transparent;border-bottom:clamp(10px,2.3vw,20px) solid transparent;border-left:clamp(16px,3.4vw,29px) solid #fff}
.play:hover{background:#000b;transform:translate(-50%,-50%) scale(1.05)}
.play:focus-visible,.hit:focus-visible{outline:3px solid #ffe243;outline-offset:3px}
.play[hidden]{display:none}
.hit{position:absolute;z-index:4;display:block;border-radius:999px}
.hit:focus-visible{box-shadow:0 0 0 4px #ffe243}
.apple{left:7.6%;top:72.8%;width:40.3%;height:7.8%}
.google{left:52.1%;top:72.8%;width:40.4%;height:7.8%}
.facebook{left:5.7%;top:84.7%;width:29.2%;height:5.6%}
.instagram{left:36%;top:84.7%;width:29.3%;height:5.6%}
.tiktok{left:66.1%;top:84.7%;width:28.7%;height:5.6%}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:480px){.play{border-width:2px}}
@media(prefers-reduced-motion:reduce){.play:hover{transform:translate(-50%,-50%)}}
</style>
</head>
<body>
<main>
<section class="mockup" aria-label="TAPSTRONAUT game and download links">
<h1 class="sr-only">TAPSTRONAUT — One tap. Endless space.</h1>
<img class="art" src="assets/landing-mockup.webp" alt="TAPSTRONAUT pixel-art landing page with gameplay preview and App Store, Google Play, Facebook, Instagram and TikTok buttons">
<div class="video-frame">
<video id="gameplay" playsinline preload="none" poster="assets/gameplay-poster.webp" aria-label="TAPSTRONAUT gameplay video with sound">
<source src="assets/tapstronaut-gameplay.mp4" type="video/mp4">
</video>
<button class="play" id="play" type="button" aria-label="Play TAPSTRONAUT gameplay with sound" aria-controls="gameplay"></button>
</div>
<a class="hit apple" href="https://apps.apple.com/gb/app/tapstronaut/id6802784394" aria-label="Download TAPSTRONAUT from the App Store"></a>
<a class="hit google" href="https://play.google.com/store/apps/details?id=com.nelsdir.tapstronaut" aria-label="Get TAPSTRONAUT on Google Play"></a>
<a class="hit facebook" href="https://www.facebook.com/Tapstronaut/" target="_blank" rel="noopener noreferrer" aria-label="Visit TAPSTRONAUT on Facebook"></a>
<a class="hit instagram" href="https://www.instagram.com/tapstronaut/" target="_blank" rel="noopener noreferrer" aria-label="Visit TAPSTRONAUT on Instagram"></a>
<a class="hit tiktok" href="https://www.tiktok.com/@tapstronaut" target="_blank" rel="noopener noreferrer" aria-label="Visit TAPSTRONAUT on TikTok"></a>
</section>
<p class="sr-only">The gameplay video plays with sound after you press play. Use the video controls to pause or adjust the volume.</p>
</main>
<script>
const video=document.getElementById("gameplay");
const playButton=document.getElementById("play");
playButton.addEventListener("click",async()=>{
  video.controls=true;
  if(video.ended) video.currentTime=0;
  try{await video.play();}catch(error){playButton.hidden=false;}
});
video.addEventListener("play",()=>{playButton.hidden=true;});
video.addEventListener("pause",()=>{if(!video.ended)playButton.hidden=false;});
video.addEventListener("ended",()=>{playButton.hidden=false;});
</script>
</body>
</html>
